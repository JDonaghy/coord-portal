name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The Cloudflare account is not wired up yet. This gate keeps main green
  # without claiming a deploy happened: because `environment: production` lives
  # on the deploy job below and that job is SKIPPED when unconfigured, GitHub
  # records no deployment at all. Putting the guard inside the deploy job would
  # stamp a "production / success" environment record on every merge while every
  # step inside skipped — a false green that is worse than a red one.
  guard:
    name: cloudflare configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — no Cloudflare account wired up yet. Nothing is deployed. See README 'Cloudflare account setup'."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: wrangler deploy
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply coord-portal --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify the deploy answers
        env:
          URL: ${{ vars.PORTAL_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::PORTAL_URL variable not set — skipping post-deploy check"
            exit 0
          fi
          for _ in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health" | tee /dev/stderr | grep -q '"ok": true'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/api/health did not report ok after deploy"
          exit 1
