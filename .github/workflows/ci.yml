name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e smoke (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  acceptance:
    # One wrangler dev per milestone instead of one for the whole 147-test,
    # 4.4-minute suite: issue #81 measured that single long-lived server
    # dying mid-run (silent `✘ [ERROR]`, no message) and forfeiting every
    # test behind it. Sharding by milestone cuts each server's lifetime to
    # roughly a third and, with fail-fast off below, isolates a crash to the
    # one milestone it hit instead of red-ing the whole gate.
    name: sealed acceptance suite (${{ matrix.milestone }})
    runs-on: ubuntu-latest
    strategy:
      # A crash in one milestone's wrangler dev must not cancel the other
      # two shards — each is an independent verdict on an independent slice
      # of the contract.
      fail-fast: false
      matrix:
        milestone: [ms-1, ms-2, ms-3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.acceptance.config.ts's webServer block runs
      # `npm run serve:acceptance`, wipes local D1 state, migrates it fresh,
      # and polls /api/health with a bounded 120s timeout before the suite
      # starts — the same readiness mechanism the e2e job above relies on for
      # `serve:test`, just pointed at the sealed suite's own port (8789) and
      # its own throwaway database. Each matrix leg gets its own runner, so
      # each milestone gets its own freshly-migrated D1 and its own wrangler
      # dev process for free — nothing here needs to coordinate across legs.
      #
      # The trailing positional arg is the milestone token itself: Playwright
      # matches it by substring against each spec's resolved path (see the
      # config's header comment), so `ms-1` selects only `tests/acceptance/ms-1/**`.
      #
      # continue-on-error: a JIT test-author slice is *deliberately* red
      # against work that hasn't landed yet (tests/acceptance/*/manifest.yml's
      # `expected_red:` block), so Playwright's own exit code can no longer be
      # the gate — every such slice would be unmergeable by construction
      # (issue #87). The two steps below are the real gate: they run
      # unconditionally (continue-on-error only stops THIS step's exit code
      # from failing the job; it does not skip what follows) and
      # acceptance-verdict.mjs is the one whose exit code the job actually
      # depends on. If either of those steps is ever skipped, a genuinely
      # broken suite goes green — do not add an `if:` to them.
      - name: Run sealed acceptance suite (${{ matrix.milestone }})
        continue-on-error: true
        run: npm run test:acceptance -- ${{ matrix.milestone }} --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: acceptance-results.json
      # A path filter that matches nothing exits 0 with 0 tests run — a
      # confidently-wrong green (see playwright.acceptance.config.ts).
      # Sharding multiplies the ways a filter can silently match nothing, so
      # every leg of the matrix gets this guard, not just the old single job.
      - name: Assert the suite didn't silently run zero tests
        run: node scripts/assert-acceptance-ran.mjs acceptance-results.json
      # The actual pass/fail gate (issue #87): reads the same JSON report as
      # the guard above and reconciles it against this milestone's
      # `expected_red:` registry — a registered-red failure doesn't fail the
      # job, but an unregistered failure, or a registered id missing from the
      # run entirely, always does. See the script's header for the exact
      # verdict and how it relates to `coord acceptance run --all --ci` in
      # claude-coordinator.
      #
      # A registered id that unexpectedly PASSED is the fourth arm, and it's
      # context-dependent (issue #92): on `main` it means the manifest's
      # `expected_red:` entry is stale and must be cleared by a human, so it
      # fails the job there. On a pull request it means the PR's own fix just
      # started working — failing the job for that makes every fix PR
      # unmergeable at the exact moment it succeeds — so it's reported but
      # left to `coord.acceptance.clear_expected_red_via_pr` to clear
      # post-merge. `--context` is how this workflow tells the script which
      # case it's in; `github.event_name` is exactly "pull_request" or
      # "push" here since those are the only two triggers above. Passed
      # explicitly rather than left for the script to infer from `GITHUB_*`
      # env vars, per #92: inferring context is untestable and is how a gate
      # quietly disarms itself on a runner that sets things differently.
      - name: Verify acceptance verdict against expected_red
        run: node scripts/acceptance-verdict.mjs acceptance-results.json ${{ matrix.milestone }} --context=${{ github.event_name }}
      # The crash issue #81 was filed over left no message and no stack in
      # the job log — wrangler had already written the detail to its own log
      # file, which nobody collected. Grab it alongside the Playwright report
      # so the next crash is diagnosable instead of a mystery.
      - name: Upload wrangler log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance-wrangler-log-${{ matrix.milestone }}
          path: ~/.config/.wrangler/logs/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: acceptance-playwright-report-${{ matrix.milestone }}
          path: playwright-report/
          retention-days: 7
