# coord-portal — Cloudflare Worker (API + static site) with D1 and R2.
#
# One Worker serves both the static site and the JSON API. That is deliberate:
# a single deploy lane and no cross-origin boundary between the page and its API.
#
# NOTHING SECRET GOES IN THIS FILE. It is committed to a public repo. API tokens
# and provider keys live in GitHub Actions secrets and `wrangler secret put`.

name = "coord-portal"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The Worker answers ONLY on the custom domain.
#
# `workers_dev = false` is not tidiness — it is load-bearing. Cloudflare Access
# protects a hostname, so while coord-portal.johnfdonaghy.workers.dev stays
# enabled it is a second, unprotected front door to the same Worker that
# bypasses every Access policy below. This line and the route must always change
# together.
workers_dev = false

[[routes]]
pattern = "intake.heurontech.com"
custom_domain = true

# NO NAMED ENVIRONMENTS, DELIBERATELY. Wrangler does not inherit bindings into
# `[env.x]` — an `[env.production]` block that omits `d1_databases`/`r2_buckets`
# deploys a Worker with neither, silently. One config, one deployment target, no
# duplicated `database_id` to drift. The Worker reports which deployment it is
# by looking at its own hostname, so nothing has to be kept in step by hand.

[observability]
enabled = true

# Issue #51: the sending address every notification email carries
# (`src/notifications.ts`). A var, not a secret — this is the whole point of
# the clause: a per-environment `From` is a one-line change here instead of a
# code change. Not pinned for production by ms-3's contract, only that it
# lives in config; #52 is expected to change this value once
# mail.heurontech.com is verified.
#
# #52 has now done exactly that. `mail.heurontech.com` is the domain verified
# with Resend (SPF at `send.mail`, DKIM at `resend._domainkey.mail`, DMARC on
# the apex) — `intake.heurontech.com` never was, and it is this Worker's own
# custom domain with no MX, so mail sent from it would be refused as an
# unverified sender and any reply would bounce into nothing.
#
# THE ACCEPTANCE ENVIRONMENT DOES NOT USE THIS VALUE. ms-3's contract pins the
# acceptance `EMAIL_FROM` to the historical `notify@intake.heurontech.com`
# literal, matching every ms-1 and ms-3 mock, and explicitly does not pin the
# production value. `serve:acceptance` / `serve:test` therefore override this
# var (see package.json) exactly as they already override MAIL_PROVIDER, which
# is what keeps the sealed suite green while production moves independently.
# Changing the address here must NOT be accompanied by an edit to
# `tests/acceptance/**` — that would be amending the oracle to match the
# implementation, which is the one thing the sealed suite exists to prevent.
[vars]
EMAIL_FROM = "coord-portal <notify@mail.heurontech.com>"

# Issue #52: where a customer's reply goes.
#
# CORRECTED 2026-08-14 by measurement (coord-portal#78, closed invalid). This
# comment previously made two claims, both false, and acting on them would have
# destroyed a working reply path:
#
#   * "`mail.heurontech.com` … has no inbound mail service, so the `From`
#     address above receives nothing." FALSE. A message from
#     `jdonaghy@heurontech.com` to `notify@mail.heurontech.com` arrives in an
#     operator inbox.
#   * "[Cloudflare Email Routing] cannot be used." FALSE. It is enabled on that
#     subdomain today, with an Active rule forwarding `notify@` onward — while
#     the apex MX records still point at Zoho and carry all real business mail.
#
# Keep the caveat that produced the second claim, in its true and weaker form:
# the Email Routing dashboard flags the Zoho apex MX/SPF as "Conflicting" and
# offers to replace them with Cloudflare's own. Accepting that takes down all
# business mail. Decline it. That is a hazard in the UI, not a reason routing
# cannot run on the subdomain.
#
# ⚠ DO NOT "CLEAN UP" THE `route*.mx.cloudflare.net` MX RECORDS AT
# `mail.heurontech.com`. They are load-bearing. They render padlocked and
# read-only in the dashboard precisely because Email Routing owns them, and
# disabling the service to remove them removes the forward with it.
#
# So a customer reply reaches a human by EITHER path, depending on whether
# their mail client honours this header:
#
#   Reply-To honoured        → jdonaghy@heurontech.com (Zoho — this var)
#   Reply-To ignored, or a
#   reply sent to `From`     → notify@mail.heurontech.com, forwarded onward by
#                              the Email Routing rule described above
#
# Nothing is lost either way, but replies do scatter across two mailboxes with
# no way to predict which. Pointing the routing rule at this same address would
# converge them; that is a deliberate open choice, not an oversight.
#
# NOT a secret: it is printed in the headers of every mail sent, and a customer
# reading their inbox can see it.
REPLY_TO = "jdonaghy@heurontech.com"

# Issue #50: the drain that sends queued `outbox` rows. Every 5 minutes is
# plenty for this repo's mail volume (CLAUDE.md: "digest-first, not
# instant"). At this cadence with no exponential backoff between attempts
# (by design, matching the contract), the retry/give-up arc (5 attempts,
# `src/drain.ts`) resolves within roughly 25 minutes worst case, not over a
# whole working day — comfortably fast, just noted here so the number in this
# comment matches the number `src/drain.ts`'s `MAX_ATTEMPTS` actually
# produces. Not reachable from local `wrangler dev` — that is exactly what
# `--test-scheduled`'s `GET /__scheduled` stands in for, see package.json.
[triggers]
crons = ["*/5 * * * *"]

# Static site. Assets are matched first; anything with no matching file falls
# through to the Worker, which is how /api/* reaches the router.
[assets]
directory = "./public"
binding = "ASSETS"

# Records. Created 2026-08-08 in region ENAM. The id is an account-scoped
# identifier, not a secret — it is useless without a credential for the account.
[[d1_databases]]
binding = "DB"
database_name = "coord-portal"
database_id = "bfe11dc0-b9b3-487e-8c22-1e7c99fec67e"
migrations_dir = "migrations"

# Mock bundles and screenshots.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "coord-portal-artifacts"
