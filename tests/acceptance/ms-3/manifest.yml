#
# NOTE for #51's author: #50's block below already exercises the fake's pinned
# black-box behaviour end to end (a `mailfail` recipient always fails, everyone
# else succeeds) because that is the only lever #50's own transitions can be
# driven with. #51's slice should assert what is left — fail-closed on an unset
# key, `MAIL_PROVIDER` selection — not re-assert these.

