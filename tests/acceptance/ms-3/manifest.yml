# ms-3 — sealed acceptance manifest: test id -> issue slice.
#
# Ids are the `web-playwright` driver's node ids, exactly as
# `coord.acceptance_drivers.parse_playwright_json_report` builds them:
#
#   [{project}] {file relative to testDir} › {describe path} › {test title}
#
# They must match character-for-character (including the `›` separators) —
# `coord acceptance run --issue N` filters by exact id, and an id that matches
# nothing is reported as a missing test, not as a pass.
#
# One block per issue. Later slices MERGE into this file; do not rewrite
# another issue's block.
#
# ms-3's remaining issues, for whoever extends this file next:
#   #55 the operator view `GET /deliveries`. #52 is `oracle:exempt` by its own
#   issue text (contract.md, Notes item 7) and gets no block here.
#
# NOTE for #51's author: #50's block below already exercises the fake's pinned
# black-box behaviour end to end (a `mailfail` recipient always fails, everyone
# else succeeds) because that is the only lever #50's own transitions can be
# driven with. #51's slice should assert what is left — fail-closed on an unset
# key, `MAIL_PROVIDER` selection — not re-assert these.

