# ms-1 — sealed acceptance manifest: test id -> issue slice.
#
# Ids are the `web-playwright` driver's node ids, exactly as
# `coord.acceptance_drivers.parse_playwright_json_report` builds them:
#
#   [{project}] {file relative to testDir} › {describe path} › {test title}
#
# They must match character-for-character (including the `›` separators) —
# `coord acceptance run --issue N` filters by exact id, and an id that matches
# nothing is reported as a missing test, not as a pass.
#
# One block per issue. Later slices MERGE into this file; do not rewrite
# another issue's block.

